  <script>
    (() => {
      const header = document.currentScript.closest('.sugar-site-header');
      const toggle = header.querySelector('.sugar-header-toggle');
      const links = header.querySelectorAll('.sugar-header-nav a');

      const close = () => {
        header.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Open navigation');
      };

      toggle.addEventListener('click', () => {
        const willOpen = !header.classList.contains('is-open');
        header.classList.toggle('is-open', willOpen);
        toggle.setAttribute('aria-expanded', String(willOpen));
        toggle.setAttribute('aria-label', willOpen ? 'Close navigation' : 'Open navigation');
      });

      links.forEach((link) => link.addEventListener('click', close));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') close();
      });
    })();

<script>
  (() => {
    const section = document.querySelector('.sugar-gallery-section');
    if (!section) return;
    const items = [...section.querySelectorAll('.sugar-gallery-item')];
    const lightbox = section.querySelector('.sugar-gallery-lightbox');
    const image = lightbox.querySelector('.sugar-gallery-lightbox-image');
    const count = lightbox.querySelector('.sugar-gallery-lightbox-count');
    const closeButton = lightbox.querySelector('.sugar-gallery-lightbox-close');
    const previousButton = lightbox.querySelector('.sugar-gallery-lightbox-prev');
    const nextButton = lightbox.querySelector('.sugar-gallery-lightbox-next');
    let activeIndex = 0;
    let lastFocused = null;

    const render = () => {
      const source = items[activeIndex].querySelector('img');
      image.src = source.currentSrc || source.src;
      image.alt = source.alt;
      count.textContent = String(activeIndex + 1).padStart(2, '0') + ' / ' + String(items.length).padStart(2, '0');
    };
    const open = (index) => {
      activeIndex = index;
      lastFocused = document.activeElement;
      render();
      lightbox.hidden = false;
      document.body.style.overflow = 'hidden';
      closeButton.focus();
    };
    const close = () => {
      lightbox.hidden = true;
      image.src = '';
      document.body.style.overflow = '';
      if (lastFocused) lastFocused.focus();
    };
    const move = (step) => {
      activeIndex = (activeIndex + step + items.length) % items.length;
      render();
    };

    items.forEach((item, index) => {
      item.tabIndex = 0;
      item.setAttribute('role', 'button');
      item.setAttribute('aria-label', 'Open gallery image ' + (index + 1));
      item.addEventListener('click', () => open(index));
      item.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          open(index);
        }
      });
    });
    closeButton.addEventListener('click', close);
    previousButton.addEventListener('click', () => move(-1));
    nextButton.addEventListener('click', () => move(1));
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) close();
    });
    document.addEventListener('keydown', (event) => {
      if (lightbox.hidden) return;
      if (event.key === 'Escape') close();
      if (event.key === 'ArrowLeft') move(-1);
      if (event.key === 'ArrowRight') move(1);
    });
  })();
</script>
